name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            binary: iclass-tui
            artifact: iclass-tui-linux-x86_64.tar.gz

          - os: macos-latest
            label: macos-universal
            binary: iclass-tui
            artifact: iclass-tui-macos-universal.tar.gz

          - os: windows-latest
            label: windows-x86_64
            binary: iclass-tui.exe
            artifact: iclass-tui-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 target (macOS universal binary)
        if: matrix.label == 'macos-universal'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary (Linux / Windows)
        if: matrix.label != 'macos-universal'
        run: cargo build --release

      - name: Build universal binary (macOS arm64 + x86_64)
        if: matrix.label == 'macos-universal'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/iclass-tui \
            target/x86_64-apple-darwin/release/iclass-tui \
            -output iclass-tui
          tar czf "${{ matrix.artifact }}" iclass-tui

      - name: Package (Linux)
        if: matrix.label == 'linux-x86_64'
        run: tar czf "${{ matrix.artifact }}" -C target/release "${{ matrix.binary }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
