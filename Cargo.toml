[package]
name = "iclass-tui"
version = "0.1.0"
edition = "2024"

[dependencies]

ratatui = "0.29"
crossterm = "0.29"

tokio = { version = "1", features = [
    "full",
    "macros",
    "rt-multi-thread"
] }

reqwest = { version = "0.12", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "macros"
] }

anyhow = "1"
thiserror = "2"

color-eyre = "0.6"

chrono = { version = "0.4", features = ["serde"] }

directories = "6"

tracing = "0.1"
tracing-subscriber = "0.3"

futures = "0.3"
